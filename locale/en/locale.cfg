[mod-setting-name]
wp-cct-open-on-enter=Open destination picker when boarding
wp-cct-honk=Play a sound when the taxi arrives
wp-cct-auto-depot=Return to depot when you step out

[mod-setting-description]
wp-cct-open-on-enter=When you climb into your Choo-Choo Taxi, the destination list pops open automatically.
wp-cct-auto-depot=When you get out of your taxi after a ride, it drives back to the depot you picked for that planet or orbit, or through the space elevator to the other side's depot if this side has none (the train-stop button in the destination list).
wp-cct-honk=Little "ding!" when your taxi is registered, arrives for pickup, or drops you off.

